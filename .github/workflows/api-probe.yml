# Prints how the real Kalshi API behaves (public data only: no key, no orders).
name: api-probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/api_probe.py", ".github/workflows/api-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Profile kal scan
        run: KAL_HOME=$(mktemp -d) python tools/mem_profile.py scan
      - name: Profile research --quick
        run: KAL_HOME=$(mktemp -d) python tools/mem_profile.py research
