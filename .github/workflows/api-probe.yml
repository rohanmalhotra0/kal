# Prints how the real Kalshi API behaves (public data only: no key, no orders).
name: api-probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/api_probe.py", ".github/workflows/api-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/anchor_snapshot.py targeted
