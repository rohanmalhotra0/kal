# Side branch only (probe/maker-smoke), never merged. Public data only: no key, no orders.
name: api-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAL_HOME: ./state
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Raw candles (live and historical) to check the trade-price fields
        run: |
          python - <<'PY'
          import json
          from kal.client import Kalshi, ts
          c = Kalshi()
          for series in ("KXHIGHNY", "KXNFLGAME"):
              ms = c.settled_markets(series, 40)
              for m in (ms[0], ms[-1]):
                  t = ts(m["close_time"])
                  cs = c.candles(series, m["ticker"], t - 8 * 3600, t + 3600)
                  print(series, m["ticker"], m["close_time"], len(cs), "candles")
                  print(json.dumps([x for x in cs if x.get("volume") or x.get("volume_fp")][-2:], indent=1))
          PY
      - name: Maker backtest, small
        run: python tools/maker_research.py --series-per-category 1 --markets-per-series 40 --max-minutes 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maker-research
          path: state/research/*.json
          retention-days: 30
