# Side branch only (probe/arb-watch-1min, never merged): watch for locked-in arbitrage
# on the real exchange every minute. Public data only: no key, no orders.
name: api-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      KAL_HOME: ./state
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/arb_watch.py --minutes 240 --every 1
