# Side branch only (probe/early-close), never merged. Public data only: no key, no orders.
name: api-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/anchor_snapshot.py compare tools/snapshot-all-2026-10-25.jsonl
