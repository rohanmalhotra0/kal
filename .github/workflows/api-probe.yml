# Side branch only (probe/xvenue), never merged. Public data only: no key, no orders.
# Runs the cross-venue research on real data and saves its output to probe-data/ on this
# same branch.
name: api-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      KAL_HOME: ./state
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/xvenue_research.py --days 90
      - name: Save the output to this branch
        if: always()
        run: |
          mkdir -p probe-data
          cp state/research/xvenue.json probe-data/ || true
          gzip -c state/cache/xvenue_rows.json > probe-data/xvenue_rows.json.gz || true
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add probe-data
          git commit -m "probe data: cross-venue research output (side branch only)" || exit 0
          git push origin HEAD:probe/xvenue
