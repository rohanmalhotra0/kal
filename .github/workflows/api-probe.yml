# Prints how the real Kalshi API behaves (public data only: no key, no orders).
name: api-probe

on:
  workflow_dispatch:
    inputs:
      args:
        description: probe arguments
        default: rules
  push:
    branches: [main]
    paths: ["tools/api_probe.py", ".github/workflows/api-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pypdf
      - run: python tools/aaa_gas_probe.py $PROBE_ARGS
        env:
          PROBE_ARGS: ${{ inputs.args }}
