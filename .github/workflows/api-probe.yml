# Side branch only (probe/early-close), never merged. Same deep research, three code versions.
name: api-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before-6
            ref: e862f2ec2e63a5375002858db21acfef8a0c438d
          - label: after-6
            ref: main
          - label: with-9
            ref: fix/schedule-anchor
    name: coverage ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      KAL_HOME: ./state
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: git log --oneline -1
      - run: python tools/deep_research.py --active --hours 6 --series-per-category 4 --markets-per-series 150 --max-minutes 140
