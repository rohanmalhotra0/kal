# Side branch only (never merged): does the fixed server install wait while Ubuntu's own
# updates hold apt's locks, and finish once they let go?
name: api-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: apt-get with a lock held (no fix)
        shell: bash {0}
        run: |
          hold() { sudo python3 -c "import fcntl,sys,time; f=open(sys.argv[1],'a'); fcntl.lockf(f, fcntl.LOCK_EX); time.sleep(int(sys.argv[2]))" "$1" "$2" & sleep 2; }
          t() { local s=$(date +%s); "$@" >/dev/null 2>/tmp/err; local rc=$?; echo "rc=$rc after $(( $(date +%s) - s )) s: $(head -c 150 /tmp/err | tr '\n' ' ')"; }
          echo "--- frontend lock held 30 s: plain install";   hold /var/lib/dpkg/lock-frontend 30; t sudo apt-get install -y -qq chrony; wait
          echo "--- frontend lock held 30 s: timeout install"; hold /var/lib/dpkg/lock-frontend 30; t sudo apt-get -o DPkg::Lock::Timeout=120 install -y -qq chrony; wait
          echo "--- lists lock held 30 s: plain update";        hold /var/lib/apt/lists/lock 30; t sudo apt-get update -qq; wait
          echo "--- lists lock held 30 s: timeout update";      hold /var/lib/apt/lists/lock 30; t sudo apt-get -o DPkg::Lock::Timeout=120 update -qq; wait
          echo "--- dpkg lock held 30 s: timeout install";      hold /var/lib/dpkg/lock 30; t sudo apt-get -o DPkg::Lock::Timeout=120 install -y -qq --reinstall chrony; wait

  fixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fixed install while both locks are held for 60 s
        shell: bash {0}
        run: |
          sudo git clone -b fix/install-apt-lock https://github.com/rohanmalhotra0/kal.git /opt/kal
          hold() { sudo python3 -c "import fcntl,sys,time; f=open(sys.argv[1],'a'); fcntl.lockf(f, fcntl.LOCK_EX); time.sleep(int(sys.argv[2]))" "$1" "$2" & }
          hold /var/lib/apt/lists/lock 60; hold /var/lib/dpkg/lock-frontend 60; sleep 2
          s=$(date +%s)
          sudo bash /opt/kal/deploy/install.sh 2>&1 | sed -E 's/(Dashboard password: ).*/\1(hidden)/; s/kal-[a-z0-9]{20}/kal-(hidden)/g; s/kal- [a-z0-9 ]{24}/kal- (hidden)/' | head -40
          echo "install rc=${PIPESTATUS[0]} after $(( $(date +%s) - s )) s"
          wait
          systemctl is-active kal kal-watch.timer
          sudo kal doctor; echo "doctor rc=$?"
      - name: Key file made with nano as root is readable by the bot
        shell: bash {0}
        run: |
          sudo bash -c 'umask; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null > /tmp/kalshi.pem; ls -l /tmp/kalshi.pem'
          sudo runuser -u kal -- test -r /tmp/kalshi.pem && echo "kal can read it"
