# Prints how the real Kalshi API behaves (public data only: no key, no orders).
name: api-probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/api_probe.py", ".github/workflows/api-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/exact_probe.py
