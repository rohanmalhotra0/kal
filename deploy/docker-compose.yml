# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Settings go in deploy/.env (never commit it). See docs/DEPLOY.md.
services:
  kal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - kal-data:/data
    ports:
      - "127.0.0.1:8787:8787"   # only this server. Use an SSH tunnel to see it.
    restart: unless-stopped
    stop_grace_period: 330s     # let a trade run finish its basket before stopping
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kal-data:
